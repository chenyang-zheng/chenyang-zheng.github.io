baseURL = 'https://chenyang-zheng.github.io/'
languageCode = 'en-us'
title = "Chenyang's Eureka"
theme = 'ananke'
# Count CJK characters when computing word count / reading time,
# otherwise Chinese text is counted by whitespace and drastically undercounted.
hasCJKLanguage = true

[outputFormats.wechat]
  name          = "wechat"
  mediaType     = "text/html"
  path          = "wechat"
  isHTML        = true
  notAlternative = true

[outputs]
  page    = ["HTML", "wechat"]
  section = ["HTML"]
  home    = ["HTML", "RSS"]

[params]
mainSections = ['posts']
license = 'cc-by-nc-sa'
show_reading_time = true

[[menu.main]]
name = 'Posts'
url = '/posts/'
weight = 10

[[menu.main]]
name = 'Read'
url = '/read/'
weight = 20

[[menu.main]]
name = 'Invests'
url = '/invests/'
weight = 30

[[menu.main]]
name = 'Careers'
url = '/careers/'
weight = 40
